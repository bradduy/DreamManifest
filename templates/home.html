<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V2T2I</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            text-align: center;
        }

        h1 {
            color: #333;
            padding: 10px;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 20px;
        }

        .video-container video {
            width: 500px;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
        }

        .prompt-container,
        .image-container {
            display: none;
            /* Hide initially */
        }

        .prompt-container {
            width: 300px;
            padding: 15px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
        }

        .image-container img {
            width: 500px;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 900px) {
            .container {
                flex-direction: column;
                align-items: center;
            }

            .video-container video,
            .image-container img {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <h1>🎥 Video to Text to Image</h1>

    <div class="container">
        <div class="video-container">
            <h2>📹 Video</h2>
            {% if video_path %}
            <video id="video" controls>
                <source src="{{ video_path }}" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            {% else %}
            <p>No video available.</p>
            {% endif %}
        </div>

        <div class="prompt-container" id="prompt-container">
            <h2>📝 Extracted Insight</h2>
            <p><strong>{{ prompt if prompt else "No prompt available yet." }}</strong></p>
        </div>

        <div class="image-container" id="image-container">
            <h2>🖼️ Generated Image</h2>
            {% if image_path %}
            <img src="{{ image_path }}" alt="Generated Image">
            {% else %}
            <p>No image available.</p>
            {% endif %}
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            setTimeout(() => {
                document.getElementById("prompt-container").style.display = "block";
                setTimeout(() => {
                    document.getElementById("image-container").style.display = "block";
                }, 8000);
            }, 5000);
        });
    </script>

</body>

</html>
